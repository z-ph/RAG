# Development dependencies only (MySQL + Qdrant)
# Run: docker compose -f docker-compose.dev.yml up
#
# Start backend and frontend on the host:
#   ./mvnw spring-boot:run
#   cd frontend && pnpm dev

services:
  mysql:
    image: docker.m.daocloud.io/mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-ChangeMe123!}
      MYSQL_DATABASE: knowledge_rag
      MYSQL_USER: knowledge
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ChangeMe123!}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD:-ChangeMe123!}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  qdrant:
    image: docker.m.daocloud.io/qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  mysql-data:
  qdrant-data:
