openapi: 3.0.3
info:
  title: Knowledge RAG API
  version: 1.1.0
  description: |
    基于当前代码实现整理的接口规范，覆盖登录鉴权、注册码管理、文档上传管理与 RAG 问答接口。

    说明：
    - 文档管理接口使用 Session Cookie 鉴权，登录成功后服务端会写入 `JSESSIONID`。
    - RAG 问答接口保持匿名可访问。
    - `/api/auth/register` 只能使用管理员创建的一次性注册码注册。
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Auth
    description: 登录、注册、当前会话与注册码管理
  - name: Documents
    description: 文档上传、列表查询、删除和健康检查
  - name: RAG
    description: 同步问答、流式问答、会话控制和健康检查
paths:
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: 登录
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: admin
              password: ChangeMe123!
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
              example:
                message: 登录成功
                user:
                  username: admin
                  role: ADMIN
        '400':
          description: 参数不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 用户名或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: 使用注册码注册
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: editor01
              password: Password123
              registrationCode: ABCD-EFGH-JKLM
      responses:
        '201':
          description: 注册成功，并自动登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
              example:
                message: 注册成功
                user:
                  username: editor01
                  role: USER
        '400':
          description: 用户名冲突、注册码无效、已使用、已禁用或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: 退出登录
      operationId: logout
      responses:
        '200':
          description: 已退出登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: 已退出登录
  /api/auth/me:
    get:
      tags:
        - Auth
      summary: 查看当前登录状态
      operationId: currentAuthStatus
      responses:
        '200':
          description: 当前会话状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatusResponse'
              examples:
                anonymous:
                  value:
                    authenticated: false
                    user: null
                authenticated:
                  value:
                    authenticated: true
                    user:
                      username: admin
                      role: ADMIN
  /api/auth/registration-codes:
    get:
      tags:
        - Auth
      summary: 管理员查看注册码列表
      operationId: listRegistrationCodes
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 注册码列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationCodeListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags:
        - Auth
      summary: 管理员创建注册码
      operationId: createRegistrationCode
      security:
        - cookieAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationCodeCreateRequest'
            example:
              note: 运营同事
              expiresAt: '2026-04-01T18:30:00'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationCodeResponse'
        '400':
          description: 到期时间不合法等参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/auth/registration-codes/{id}/disable:
    patch:
      tags:
        - Auth
      summary: 管理员禁用注册码
      operationId: disableRegistrationCode
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RegistrationCodeId'
      responses:
        '200':
          description: 禁用成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationCodeResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: 注册码不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/registration-codes/{id}:
    delete:
      tags:
        - Auth
      summary: 管理员删除注册码
      operationId: deleteRegistrationCode
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RegistrationCodeId'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: 注册码已删除
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: 注册码不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/documents/upload:
    post:
      tags:
        - Documents
      summary: 上传并处理文档
      operationId: uploadDocument
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 仅支持 `.pdf` 和 `.txt`
      responses:
        '200':
          description: 文档处理成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '400':
          description: 文件为空、文件名缺失或文件格式不支持
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          description: 文档解析、切块或向量入库失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/documents:
    get:
      tags:
        - Documents
      summary: 获取已上传文档列表
      operationId: listDocuments
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 文档列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          description: 查询失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/documents/{documentId}:
    delete:
      tags:
        - Documents
      summary: 删除指定文档
      operationId: deleteDocument
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDeleteResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 未找到对应文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 删除失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/documents/health:
    get:
      tags:
        - Documents
      summary: 文档服务健康检查
      operationId: documentHealth
      responses:
        '200':
          description: 服务正常
          content:
            text/plain:
              schema:
                type: string
              example: 文档服务运行正常
  /api/rag/ask:
    post:
      tags:
        - RAG
      summary: 同步 RAG 问答
      operationId: askRag
      description: |
        同步返回最终答案与来源片段。

        注意：
        - `conversationId` 可选。
        - 如果未传 `conversationId`，服务不会自动生成会话 ID，响应中的 `conversationId` 也会是 `null`。
        - `maxResults` 的最终生效值不会超过服务端配置 `rag.max-results`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RagRequest'
            example:
              question: 信访受理流程是什么？
              conversationId: case-001
              maxResults: 5
      responses:
        '200':
          description: 问答成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagResponse'
        '400':
          description: 请求无效，例如问题为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 问答处理失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/rag/ask/stream:
    post:
      tags:
        - RAG
      summary: 流式 RAG 问答
      operationId: askRagStream
      description: |
        使用 `text/event-stream` 持续推送回答过程。

        典型事件顺序：
        - `start`
        - `sources`
        - `thinking_delta`
        - `thinking_end`
        - `delta`
        - `complete`
        - `cancelled`
        - `error`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RagRequest'
      responses:
        '200':
          description: SSE 事件流
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: 请求无效，例如问题为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 建流前即失败时返回；建流后的错误通常以 SSE `error` 事件推送
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/rag/conversations/{conversationId}/cancel:
    post:
      tags:
        - RAG
      summary: 取消指定会话的进行中生成任务
      operationId: cancelConversationGeneration
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: 取消成功
          content:
            text/plain:
              schema:
                type: string
              example: 已取消该会话的进行中生成任务
        '404':
          description: 当前会话没有进行中的生成任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/rag/conversations/{conversationId}:
    delete:
      tags:
        - RAG
      summary: 清空指定会话上下文
      operationId: clearConversation
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: 清理成功
          content:
            text/plain:
              schema:
                type: string
              example: 会话上下文已清空
  /api/rag/health:
    get:
      tags:
        - RAG
      summary: RAG 服务健康检查
      operationId: ragHealth
      responses:
        '200':
          description: 服务正常
          content:
            text/plain:
              schema:
                type: string
              example: RAG 服务运行正常
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
  responses:
    UnauthorizedError:
      description: 未登录
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 未登录
            message: 请先登录后再访问该接口
            timestamp: '2026-03-29T18:00:00'
    ForbiddenError:
      description: 无权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 无权限
            message: 当前账号无权执行该操作
            timestamp: '2026-03-29T18:00:00'
  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      description: 文档唯一标识
      schema:
        type: string
    ConversationId:
      name: conversationId
      in: path
      required: true
      description: 会话唯一标识
      schema:
        type: string
    RegistrationCodeId:
      name: id
      in: path
      required: true
      description: 注册码主键 ID
      schema:
        type: integer
        format: int64
  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    RegisterRequest:
      type: object
      required:
        - username
        - password
        - registrationCode
      properties:
        username:
          type: string
        password:
          type: string
        registrationCode:
          type: string
    AuthUserResponse:
      type: object
      required:
        - username
        - role
      properties:
        username:
          type: string
        role:
          type: string
          example: ADMIN
    AuthSuccessResponse:
      type: object
      required:
        - message
        - user
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/AuthUserResponse'
    AuthStatusResponse:
      type: object
      required:
        - authenticated
      properties:
        authenticated:
          type: boolean
        user:
          allOf:
            - $ref: '#/components/schemas/AuthUserResponse'
          nullable: true
    RegistrationCodeCreateRequest:
      type: object
      properties:
        note:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
    RegistrationCodeListResponse:
      type: object
      required:
        - codes
        - total
      properties:
        codes:
          type: array
          items:
            $ref: '#/components/schemas/RegistrationCodeResponse'
        total:
          type: integer
          format: int32
    RegistrationCodeResponse:
      type: object
      required:
        - id
        - code
        - createdBy
        - createdAt
        - status
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        note:
          type: string
          nullable: true
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        usedAt:
          type: string
          format: date-time
          nullable: true
        usedBy:
          type: string
          nullable: true
        disabledAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [AVAILABLE, USED, DISABLED, EXPIRED]
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    RagRequest:
      type: object
      required:
        - question
      properties:
        question:
          type: string
          minLength: 1
        conversationId:
          type: string
          nullable: true
        maxResults:
          type: integer
          nullable: true
          minimum: 1
    RagResponse:
      type: object
      required:
        - answer
        - sources
      properties:
        answer:
          type: string
        thinking:
          type: string
          nullable: true
        conversationId:
          type: string
          nullable: true
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceReference'
    SourceReference:
      type: object
      required:
        - filename
        - excerpt
        - relevanceScore
      properties:
        filename:
          type: string
        excerpt:
          type: string
        relevanceScore:
          type: number
          format: double
    DocumentResponse:
      type: object
      required:
        - message
        - segmentCount
      properties:
        documentId:
          type: string
          nullable: true
        filename:
          type: string
          nullable: true
        message:
          type: string
        segmentCount:
          type: integer
          format: int32
          minimum: 0
    DocumentListResponse:
      type: object
      required:
        - documents
        - total
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentListItemResponse'
        total:
          type: integer
          format: int32
          minimum: 0
    DocumentListItemResponse:
      type: object
      required:
        - documentId
        - filename
        - segmentCount
      properties:
        documentId:
          type: string
        filename:
          type: string
        segmentCount:
          type: integer
          format: int32
          minimum: 0
    DocumentDeleteResponse:
      type: object
      required:
        - documentId
        - deletedSegments
        - message
      properties:
        documentId:
          type: string
        deletedSegments:
          type: integer
          format: int32
          minimum: 0
        message:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
        - message
        - timestamp
      properties:
        error:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
